<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Contaminants | Northern Contaminants Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="search-page">
    <!-- Page title banner -->
    <section class="search-title-banner" aria-labelledby="contaminants-page-title">
      <h1 class="search-page-title" id="contaminants-page-title">
        Northern Contaminants Database
      </h1>
    </section>

    <!-- Contaminants page content -->
    <section class="contaminants-page-content" aria-labelledby="contaminants-heading">
      <div class="contaminants-page-shell">
        <section class="contaminants-list-panel" aria-label="Browse contaminants">
          <h2 class="contaminants-heading" id="contaminants-heading">Browse Contaminants:</h2>

          <!-- Supabase-rendered contaminants will be inserted into this grid -->
          <div class="contaminants-grid" id="contaminants-grid">
            <p class="contaminants-status-message">Loading contaminants...</p>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
