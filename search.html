<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northern Contaminants Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="index.html" aria-label="Northern Contaminants Database home">
      <span class="site-brand-mark">NCD</span>
      <span class="site-brand-text">Northern Contaminants Database</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="site-nav-link" href="index.html">Home</a>
      <a class="site-nav-link is-active" href="search.html">Search</a>
      <a class="site-nav-link" href="locations.html">Locations</a>
      <a class="site-nav-link" href="contaminants.html">Contaminants</a>
      <a class="site-nav-link" href="browse_categories.html">Categories</a>
    </nav>
  </header>

  <main class="search-page">
    <!-- Page title banner -->
    <section class="search-title-banner" aria-labelledby="search-page-title">
      <p class="eyebrow">Database search</p>
      <h1 class="search-page-title" id="search-page-title">Search records</h1>
    </section>

    <!-- Search input and sort controls -->
    <section class="search-controls" aria-label="Search controls">
      <div class="search-controls-inner">
        <form class="search-form" action="#" method="get">
          <!-- Main search input -->
          <div class="search-input-wrap">
            <label class="visuallyHidden" for="search-page-input">Search database</label>
            <input
              class="search-page-input"
              id="search-page-input"
              name="q"
              type="search"
              placeholder=""
            >
            <button class="search-clear-button" type="reset" aria-label="Clear search">
              &times;
            </button>
          </div>

            <button class="search-submit-button" type="submit">Search</button>
        </form>

        <!-- Placeholder sort dropdown: replace options with real sort modes when search logic is connected -->
        <div class="sort-control">
          <label class="sort-label" for="search-sort">Sort by:</label>
          <select class="sort-select" id="search-sort" name="sort">
            <option value="relevance">Relevance</option>
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Main content area: filters on the left, results in the center -->
    <section class="search-content" aria-label="Search page content">
      <!-- Search filters -->
      <aside class="search-filters" aria-label="Filters">
        <!-- Result type filter group -->
        <div class="filter-group">
          <h2 class="filter-group-title">Type</h2>
          <label class="filter-radio">
            <input type="radio" name="result-type" value="all" checked>
            <span>All result types</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="result-type" value="ncp-reports">
            <span>NCP Reports</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="result-type" value="publications">
            <span>Publications</span>
          </label>
          <label class="filter-radio">
            <input type="radio" name="result-type" value="pdc">
            <span>PDC (Polar Data Catalog)</span>
          </label>
        </div>

        <!-- Dynamic contaminant filter group -->
        <div class="filter-group dynamic-filter-group" id="contaminant-filter-group" hidden>
          <h2 class="filter-group-title">Contaminant</h2>
          <div class="dynamic-filter-options" id="contaminant-filter-options"></div>
        </div>

        <!-- Dynamic location filter group -->
        <div class="filter-group dynamic-filter-group" id="location-filter-group" hidden>
          <h2 class="filter-group-title">Location</h2>
          <div class="dynamic-filter-options" id="location-filter-options"></div>
        </div>

        <!-- Dynamic animal filter group -->
        <div class="filter-group dynamic-filter-group" id="animal-filter-group" hidden>
          <h2 class="filter-group-title">Animal</h2>
          <div class="dynamic-filter-options" id="animal-filter-options"></div>
        </div>
      </aside>

      <!-- Search results container -->
      <div class="search-results-panel">
        <!-- Placeholder results block: replace with dynamically rendered search results, pagination, and empty states -->
        <div class="search-results-placeholder">
          <div class="search-results-placeholder-card">
            <p class="search-results-kicker">Search results</p>
            <h2 class="search-results-title">Results will render here</h2>
            <p class="search-results-copy">
              Use this panel for your Supabase search output, pagination, and result cards.
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="site-footer-logos" aria-label="Program partners">
      <img src="images/ncp-logo.png" alt="Northern Contaminants Program">
      <img src="images/polar-logo.png" alt="Polar Knowledge Canada">
    </div>
    <nav class="site-footer-links" aria-label="Footer navigation">
      <a href="#">Privacy</a>
      <a href="#">Contact Us</a>
    </nav>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
