<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Locations | Northern Contaminants Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="index.html" aria-label="Northern Contaminants Database home">
      <span class="site-brand-mark">NCD</span>
      <span class="site-brand-text">Northern Contaminants Database</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="site-nav-link" href="index.html">Home</a>
      <a class="site-nav-link" href="search.html">Search</a>
      <a class="site-nav-link is-active" href="locations.html">Locations</a>
      <a class="site-nav-link" href="contaminants.html">Contaminants</a>
      <a class="site-nav-link" href="browse_categories.html">Categories</a>
    </nav>
  </header>

  <main class="search-page">
    <!-- Page title banner -->
    <section class="search-title-banner" aria-labelledby="locations-page-title">
      <p class="eyebrow">Browse geography</p>
      <h1 class="search-page-title" id="locations-page-title">Locations</h1>
    </section>

    <!-- Locations page content -->
    <section class="locations-page-content" aria-labelledby="locations-heading">
      <div class="locations-page-shell">
        <section class="locations-list-panel" aria-label="Browse locations">
          <h2 class="locations-heading" id="locations-heading">Browse Locations:</h2>

          <!-- Supabase-rendered locations will be inserted into this grid -->
          <div class="locations-grid" id="locations-grid">
            <p class="locations-status-message">Loading locations...</p>
          </div>
        </section>

        <aside class="locations-map-panel" aria-label="Map preview">
          <!-- Placeholder map container: replace this with your embedded ArcGIS map later -->
          <div class="locations-map-placeholder">
            <div class="locations-map-placeholder-inner">
              <p class="locations-map-kicker">Map</p>
              <p class="locations-map-copy">
                ArcGIS map placeholder. Location markers and interactivity will go here later.
              </p>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="site-footer-logos" aria-label="Program partners">
      <img src="images/ncp-logo.png" alt="Northern Contaminants Program">
      <img src="images/polar-logo.png" alt="Polar Knowledge Canada">
    </div>
    <nav class="site-footer-links" aria-label="Footer navigation">
      <a href="#">Privacy</a>
      <a href="#">Contact Us</a>
    </nav>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
